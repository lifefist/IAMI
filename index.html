<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="新药风云">
<title>新药风云 · 从靶点到上市 v3.1</title>
<style>
:root{
  --bg:#0b0f1a; --panel:#131a29; --panel2:#182033; --line:#26314a;
  --txt:#e8eefc; --dim:#8fa0c0; --ok:#3ddc97; --warn:#ffcf5c; --bad:#ff6b6b;
  --brand:#4f8cff; --brand2:#7c5cff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);overscroll-behavior-y:none;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  background-image:radial-gradient(900px 460px at 12% -8%,#1b2744 0%,rgba(11,15,26,0) 62%);
  background-repeat:no-repeat;
}
#app{padding:calc(10px + var(--safe-t)) 12px calc(96px + var(--safe-b))}
h1{font-size:17px;margin:2px 0 10px;font-weight:700;letter-spacing:.4px;display:flex;align-items:center;justify-content:space-between}
h1 .ver{font-size:11px;color:var(--dim);font-weight:400;margin-left:6px}
h1 a{font-size:12px;color:var(--brand);text-decoration:none;font-weight:400}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat span{display:block;font-size:11px;color:var(--dim)}
.stat b{font-size:16px;font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--bad)}
.count{font-size:12px;color:var(--dim);margin:14px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card.stalled{border-color:#5b4a1f;background:linear-gradient(180deg,#241d10,#1a1509)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.code{font-size:16px;font-weight:700}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#22304d;color:#a9c4ff;margin-left:6px;vertical-align:middle;font-weight:400}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap}
.badge.ok{background:#123326;color:var(--ok)}
.badge.warn{background:#33290f;color:var(--warn)}
.sub{font-size:12px;color:var(--dim);margin-top:5px}
.barline{height:8px;background:#0e1524;border-radius:6px;overflow:hidden;margin:9px 0 6px;border:1px solid #1d2740}
.barline i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.tiers.three{grid-template-columns:repeat(3,1fr)}
.tiers button{min-height:44px;font-size:13px;border-radius:10px;background:transparent;color:var(--dim)}
.tiers button.on{border-color:var(--brand);background:#16305c;color:#cfe0ff;font-weight:700}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1}
button{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.99)}
button.primary{background:linear-gradient(180deg,#3f7bff,#2f5be0);border-color:#4f8cff;font-weight:700;color:#fff}
button.ghost{background:transparent;color:var(--dim)}
button:disabled{opacity:.45}
#log{background:#0d1424;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;height:96px;overflow:hidden;color:#bdcbe6}
#log.folded{height:42px;overflow:hidden;color:var(--dim)}
#log p{margin:0 0 4px}
#log .g{color:var(--ok)} #log .r{color:var(--bad)} #log .y{color:var(--warn)}
footer{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  padding:8px 12px calc(8px + var(--safe-b));background:rgba(11,15,26,.93);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
footer .primary{grid-column:1 / -1;min-height:48px;font-size:16px}
footer button{min-height:44px;font-size:14px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,7,14,.72);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{width:100%;max-height:88dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:14px 14px calc(18px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet h2{font-size:16px;margin:0 0 8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#111a2b}
.opt.on{border-color:var(--brand);background:#16305c}
@media(min-width:760px){
  #app{max-width:820px;margin:0 auto;padding-bottom:24px}
  .bar{grid-template-columns:repeat(4,1fr)}
  footer{left:50%;transform:translateX(-50%);width:100%;max-width:820px;grid-template-columns:2fr 1fr 1fr 1fr;border-radius:14px 14px 0 0}
  footer .primary{grid-column:auto}
  .modal{align-items:center}
  .sheet{max-width:560px;border-radius:16px;max-height:82vh}
  #log{height:170px}
}
</style>
</head>
<body>
<div id="app">
  <h1>新药风云<span class="ver" id="s-ver">v3.1 · 移动优先</span><a href="javascript:openRules()">玩法说明</a></h1>
  <div class="bar">
    <div class="stat"><span>时间</span><b id="s-time">第 1 年 Q1</b></div>
    <div class="stat" id="cash-box"><span>现金（亿）</span><b id="s-cash">8.00</b></div>
    <div class="stat"><span>团队等级</span><b id="s-team">Lv1</b></div>
    <div class="stat"><span>剩余融资轮次</span><b id="s-fin">4</b></div>
  </div>

  <div class="count" id="pipe-head"><span>在研管线</span><span>0/3</span></div>
  <section id="projects"></section>
  <section id="market"></section>

  <div class="count"><span>事件日志（点一下可折叠）</span><span id="exp-tip">经验加成 +0%</span></div>
  <div id="log" class="folded" onclick="toggleLog()"></div>
</div>

<footer>
  <button class="primary" onclick="nextQuarter()">推进下一季度 ▶</button>
  <button onclick="openProject()">立项</button>
  <button onclick="openFinance()">融资</button>
  <button onclick="openHire()">扩招</button>
</footer>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>

<script>
/* ========== 小工具 ========== */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f2 = v => (v < 0 ? '-' : '') + Math.abs(v).toFixed(2);
const stars = n => '★'.repeat(n) + '☆'.repeat(3 - n);

/* ========== 配置表 ========== */
const MAX_Q = 40, IND_COST_INIT = 0.5, RETRY_COST = 1.2, MAX_TEAM = 5;

/* 难度：pass 为全体阶段通过率加减，evt 为季度随机事件触发概率 */
const DIFFS = {
  easy:  {k:'easy',  n:'新手', pass: 0.08, cash:10, evt:0.30},
  normal:{k:'normal',n:'标准', pass: 0.00, cash:8,  evt:0.40},
  hard:  {k:'hard',  n:'硬核', pass:-0.07, cash:6,  evt:0.55}
};

/* 难度系数越高 = 越容易通过；峰值年收入单位：亿 */
const INDS = [
  {id:'onco', n:'晚期实体瘤',        coef:0.55, peak:62, cost:1.35},
  {id:'ad',   n:'阿尔茨海默病',      coef:0.62, peak:55, cost:1.30},
  {id:'rare', n:'罕见病（基因治疗）', coef:0.72, peak:26, cost:1.40},
  {id:'ra',   n:'自身免疫（类风湿）', coef:0.95, peak:40, cost:1.10},
  {id:'dm',   n:'2 型糖尿病',        coef:1.15, peak:34, cost:0.95},
  {id:'cv',   n:'高血脂/心血管',      coef:1.25, peak:30, cost:0.90},
  {id:'flu',  n:'流感抗病毒',        coef:1.38, peak:18, cost:0.85},
  {id:'hz',   n:'带状疱疹疫苗',      coef:1.70, peak:22, cost:0.80}
];

/* 阶段基础通过率参考公开数据：发现 51%、临床前 69%、临床合计≈12.9%、上市申请 91% */
const STAGES = [
  {n:'靶点发现',   base:0.51, need:2, cost:0.12, clinical:false},
  {n:'先导优化',   base:0.66, need:3, cost:0.18, clinical:false},
  {n:'临床前研究', base:0.69, need:2, cost:0.22, clinical:false},
  {n:'IND 申报',   base:0.86, need:1, cost:0.12, clinical:false},
  {n:'I 期临床',   base:0.62, need:2, cost:0.30, clinical:true},
  {n:'II 期临床',  base:0.36, need:3, cost:0.45, clinical:true},
  {n:'III 期临床', base:0.56, need:4, cost:0.85, clinical:true},
  {n:'NDA 审批',   base:0.91, need:2, cost:0.28, clinical:false},
  {n:'上市销售',   base:1.00, need:0, cost:0.00, clinical:false}
];

const TIERS = [
  {k:'pause', n:'暂停',  c:0,   s:0,   p:0},
  {k:'low',   n:'低投入', c:0.6, s:0.7, p:-0.04},
  {k:'mid',   n:'中投入', c:1,   s:1,   p:0},
  {k:'high',  n:'高投入', c:1.9, s:1.5, p:0.06}
];
const tierOf = k => TIERS.find(t => t.k === k);

/* 上市后销售投入档位：rate 为销售费用率，def 为每季度份额防守值 */
const SALES = [
  {k:'low',  n:'低销售', rate:0.12, def:0.000},
  {k:'mid',  n:'中销售', rate:0.20, def:0.010},
  {k:'high', n:'高销售', rate:0.30, def:0.022}
];
const salesOf = k => SALES.find(t => t.k === k) || SALES[1];
const SHARE_DECAY = 0.012;   /* 每季度被动流失的市场份额 */

const MODALS = [
  {n:'小分子',    pre:'SM'},  {n:'单克隆抗体', pre:'mAb'}, {n:'双特异性抗体', pre:'BsAb'},
  {n:'ADC',      pre:'ADC'}, {n:'融合蛋白',   pre:'FP'},  {n:'siRNA', pre:'si'},
  {n:'mRNA 疫苗', pre:'mR'},  {n:'细胞治疗',   pre:'CT'}
];
const TARGETS = ['PD-1','EGFR','KRAS G12C','TIGIT','CLDN18.2','IL-6R','PCSK9','GLP-1R',
                 'BACE1','SGLT2','Aβ 蛋白','LAG-3','CD19','Tau 蛋白','C5 补体','VEGF-A'];
const FIN_ROUNDS = [{amt:3.0,eq:0.10},{amt:2.5,eq:0.12},{amt:2.0,eq:0.15},{amt:1.5,eq:0.20}];

/* ========== 状态 ========== */
let S = null, UID = 1;
let PICK = {cands:[], ci:-1, ii:-1};
const KEY = 'pharma_v3_save';

function newGame(k){
  const d = DIFFS[k] || DIFFS.normal;
  S = {diff: d, q:1, cash: d.cash, equity:0, finUsed:0, team:1,
       exp:0, fails:0, launched:0, projects:[], marketed:[], logs:[],
       mods:{pass:0,cost:1,speed:1,rev:1}, over:false, result:null};
  log('公司成立（' + d.n + '难度）：账上 ' + d.cash + ' 亿，管线为零。点底部「立项」挑一个分子开始。', 'y');
  render();
}
function log(t, cls){
  S.logs.unshift({t, cls: cls || ''});
  if (S.logs.length > 60) S.logs.pop();
}
function toast(t){ log(t, 'y'); render(); }

/* ========== 存档 ========== */
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s = localStorage.getItem(KEY); return s ? migrate(JSON.parse(s)) : null; }catch(e){ return null; } }
function migrate(s){                     /* 兼容 v3 存档 */
  if (!s.diff) s.diff = DIFFS.normal;
  if (!s.mods) s.mods = {pass:0,cost:1,speed:1,rev:1};
  (s.marketed || []).forEach(m => {
    if (m.share == null) m.share = 1;
    if (!m.tier) m.tier = 'mid';
    if (m.comp == null) m.comp = 0;
    if (!m.id) m.id = 'm' + (UID++);
  });
  return s;
}

/* ========== 计算 ========== */
const teamSpeed = () => 1 + (S.team - 1) * 0.06;
function updateExp(){ S.exp = Math.min(0.18, S.fails * 0.03 + S.launched * 0.05); }
function estRate(p, withMods){
  const st = STAGES[p.stage];
  let r = st.base * p.ind.coef * p.cand.pot + S.exp + (S.team - 1) * 0.015
        + tierOf(p.tier).p + S.diff.pass;
  if (withMods) r += S.mods.pass;
  return clamp(r, 0.03, 0.95);
}
function genCandidate(){
  const m = MODALS[rnd(MODALS.length)];
  const pot = [0.90, 1.00, 1.12][rnd(3)];
  const cost = [0.90, 1.00, 1.15][rnd(3)];
  return {code: m.pre + '-' + (1000 + rnd(9000)), mod: m.n, target: TARGETS[rnd(TARGETS.length)],
          pot, cost, stars: pot === 1.12 ? 3 : (pot === 1.00 ? 2 : 1)};
}

/* ========== 渲染 ========== */
function render(){
  const y = Math.floor((S.q - 1) / 4) + 1, qi = (S.q - 1) % 4 + 1;
  $('#s-ver').textContent = 'v3.1 · ' + S.diff.n + '难度';
  $('#s-time').textContent = '第 ' + y + ' 年 Q' + qi;
  $('#s-cash').textContent = f2(S.cash);
  $('#cash-box').className = 'stat' + (S.cash < 1 ? ' bad' : '');
  $('#s-team').textContent = 'Lv' + S.team;
  $('#s-fin').textContent = (FIN_ROUNDS.length - S.finUsed) + ' 轮';
  $('#exp-tip').textContent = '经验加成 +' + (S.exp * 100).toFixed(0) + '%';
  $('#pipe-head').innerHTML = '<span>在研管线</span><span>'
    + S.projects.filter(p => p.status !== 'launched').length + '/3 · 已上市 ' + S.launched + ' 个</span>';
  renderProjects(); renderMarket(); renderLog(); save();
}
function renderProjects(){
  const list = S.projects.filter(p => p.status !== 'launched');
  const el = $('#projects');
  if (!list.length){
    el.innerHTML = '<div class="card"><div class="sub">暂无在研项目。点底部「立项」选择候选分子开始研发（-' + IND_COST_INIT + ' 亿）。</div></div>';
    return;
  }
  el.innerHTML = list.map(p => {
    const st = STAGES[p.stage], t = tierOf(p.tier);
    const stalled = p.status === 'stalled';
    const need = st.need || 1;
    const pct = clamp(p.progress / need * 100, 0, 100);
    const remain = (!t.s || stalled) ? '—' : Math.max(1, Math.ceil((need - p.progress) / (t.s * teamSpeed())));
    return '<div class="card ' + (stalled ? 'stalled' : '') + '">'
      + '<div class="top"><div>'
      +   '<div class="code">' + p.cand.code + '<span class="tag">' + p.cand.mod + '</span></div>'
      +   '<div class="sub">靶点 ' + p.cand.target + ' · 成药性 ' + stars(p.cand.stars) + ' · 成本系数 ' + p.cand.cost.toFixed(2) + '</div>'
      +   '<div class="sub">适应症 ' + p.ind.n + ' · 难度系数 ' + p.ind.coef + ' · 峰值收入 ' + p.ind.peak + ' 亿/年</div>'
      + '</div><div class="badge ' + (stalled ? 'warn' : 'ok') + '">' + (stalled ? '暂缓待决' : st.n) + '</div></div>'
      + '<div class="barline"><i style="width:' + (stalled ? 100 : pct) + '%"></i></div>'
      + '<div class="sub">进度 ' + pct.toFixed(0) + '% · 本阶段参考通过率 ≈ ' + (estRate(p) * 100).toFixed(0)
      +   '% · 预计还需 ' + remain + ' 个季度 · 已投入 ' + f2(p.spend) + ' 亿</div>'
      + (stalled
          ? '<div class="sub">复议失败即终止；' + p.stall + ' 个季度后窗口自动关闭。</div>'
            + '<div class="row"><button class="primary" onclick="retry(\'' + p.id + '\')">补充数据复议（-' + RETRY_COST + ' 亿）</button>'
            + '<button class="ghost" onclick="kill(\'' + p.id + '\')">终止项目</button></div>'
          : '<div class="tiers">' + TIERS.map(t2 =>
              '<button class="' + (p.tier === t2.k ? 'on' : '') + '" onclick="setTier(\'' + p.id + '\',\'' + t2.k + '\')">' + t2.n + '</button>'
            ).join('') + '</div>')
      + '</div>';
  }).join('');
}
function renderMarket(){
  const el = $('#market');
  if (!S.marketed.length){ el.innerHTML = ''; return; }
  const gross = S.marketed.reduce((a, m) => a + (m.lastGross || 0), 0);
  const sg    = S.marketed.reduce((a, m) => a + (m.lastSg || 0), 0);
  const net   = S.marketed.reduce((a, m) => a + (m.lastRev || 0), 0);
  el.innerHTML = '<div class="count"><span>已上市产品</span><span>毛 ' + f2(gross) + ' · 费用 ' + f2(sg) + ' · 净 ' + f2(net) + ' 亿</span></div>'
    + S.marketed.map(m => {
      const t = salesOf(m.tier);
      const trend = (t.def - SHARE_DECAY) * 100;
      const threat = '●'.repeat(m.comp) + '○'.repeat(4 - m.comp);
      return '<div class="card">'
        + '<div class="top"><div class="code">' + m.name + '<span class="tag">' + m.ind + '</span>'
        +   '<div class="sub">峰值年收入 ' + m.peak.toFixed(1) + ' 亿 · 上市 ' + m.q + ' 个季度 · 市场份额 '
        +   (m.share * 100).toFixed(0) + '%</div>'
        +   '<div class="sub">竞品威胁 ' + threat + (m.c3 ? '（已有竞品上市）' : '')
        +   (m.q > 32 ? ' · 已过专利悬崖，收入降至 40%' : '') + '</div>'
        + '</div><div class="badge ok">净 ' + f2(m.lastRev || 0) + ' 亿</div></div>'
        + '<div class="sub">本季毛收入 ' + f2(m.lastGross || 0) + ' 亿 · 销售费用 ' + f2(m.lastSg || 0)
        +   ' 亿（费用率 ' + (t.rate * 100).toFixed(0) + '%）</div>'
        + '<div class="tiers three">' + SALES.map(x =>
            '<button class="' + (m.tier === x.k ? 'on' : '') + '" onclick="setSales(\'' + m.id + '\',\'' + x.k + '\')">' + x.n + '</button>'
          ).join('') + '</div>'
        + '<div class="sub">份额趋势 ' + (trend >= 0 ? '+' : '') + trend.toFixed(1) + '%/季（'
        + (trend >= 0 ? '防守成功' : '缓慢流失') + '）</div>'
        + '</div>';
    }).join('');
}
function renderLog(){
  $('#log').innerHTML = S.logs.map(x => '<p class="' + x.cls + '">' + x.t + '</p>').join('');
}
function toggleLog(){ $('#log').classList.toggle('folded'); }
function setSales(id, k){
  const m = S.marketed.find(x => x.id === id);
  if (!m) return;
  m.tier = k; render();
}

/* ========== 操作：立项 ========== */
function openProject(){
  if (S.over) return;
  PICK = {cands:[genCandidate(), genCandidate(), genCandidate()], ci:-1, ii:-1};
  drawProjectSheet();
}
function drawProjectSheet(){
  const ok = PICK.ci >= 0 && PICK.ii >= 0 && S.projects.filter(p => p.status !== 'launched').length < 3 && S.cash >= IND_COST_INIT;
  sheetHTML('<h2>立项：候选分子三选一</h2>'
    + '<div class="sub">选定分子与适应症，支付 ' + IND_COST_INIT + ' 亿立项费。当前管线 '
    + S.projects.filter(p => p.status !== 'launched').length + '/3。</div>'
    + PICK.cands.map((c, i) =>
        '<div class="opt ' + (PICK.ci === i ? 'on' : '') + '" onclick="pickCand(' + i + ')">'
        + '<div class="code">' + c.code + '<span class="tag">' + c.mod + '</span></div>'
        + '<div class="sub">靶点 ' + c.target + ' · 成药性 ' + stars(c.stars) + ' · 研发成本系数 ' + c.cost.toFixed(2) + '</div></div>').join('')
    + '<h2 style="margin-top:12px">选择适应症</h2>'
    + INDS.map((x, i) =>
        '<div class="opt ' + (PICK.ii === i ? 'on' : '') + '" onclick="pickInd(' + i + ')">'
        + '<div>' + x.n + '</div>'
        + '<div class="sub">难度系数 ' + x.coef + '（越高越易通过）· 峰值年收入 ' + x.peak + ' 亿 · 成本系数 ' + x.cost + '</div></div>').join('')
    + '<div class="row"><button class="primary" ' + (ok ? '' : 'disabled') + ' onclick="confirmProject()">确认立项（-' + IND_COST_INIT + ' 亿）</button>'
    + '<button class="ghost" onclick="closeSheet()">取消</button></div>');
}
function pickCand(i){ PICK.ci = i; drawProjectSheet(); }
function pickInd(i){ PICK.ii = i; drawProjectSheet(); }
function confirmProject(){
  if (PICK.ci < 0 || PICK.ii < 0) return;
  if (S.cash < IND_COST_INIT){ toast('现金不足，无法支付立项费。'); return; }
  const cand = PICK.cands[PICK.ci], ind = INDS[PICK.ii];
  S.cash -= IND_COST_INIT;
  S.projects.push({id:'p' + (UID++), cand, ind, stage:0, progress:0, tier:'mid',
                   status:'active', retryUsed:false, stall:0, spend:IND_COST_INIT});
  log('立项：' + cand.code + '（' + cand.mod + '）针对 ' + ind.n + '，支付 ' + IND_COST_INIT + ' 亿。默认中投入，可在项目卡上调整档位。', 'g');
  closeSheet(); render();
}

/* ========== 操作：档位 / 复议 / 终止 ========== */
function setTier(id, k){
  const p = S.projects.find(x => x.id === id);
  if (!p || p.status !== 'active') return;
  p.tier = k; render();
}
function kill(id){
  const p = S.projects.find(x => x.id === id);
  if (!p) return;
  S.projects = S.projects.filter(x => x !== p);
  S.fails++; updateExp();
  log('主动终止 ' + p.cand.code + '。累计失败经验，后续项目通过率提升。', 'r');
  render();
}
function retry(id){
  const p = S.projects.find(x => x.id === id);
  if (!p || p.status !== 'stalled') return;
  if (S.cash < RETRY_COST){ toast('现金不足 ' + RETRY_COST + ' 亿，无法支付复议费用。'); return; }
  S.cash -= RETRY_COST; p.retryUsed = true;
  const st = STAGES[p.stage];
  const rate = clamp(estRate(p, true) * 0.85, 0.03, 0.95);
  const roll = Math.random() * 100, pass = roll <= rate * 100;
  log('补充数据复议：' + p.cand.code + ' ' + st.n + ' 通过率 ' + (rate * 100).toFixed(0)
      + '%，掷出 ' + roll.toFixed(1) + ' → ' + (pass ? '通过 ✅' : '失败 ❌'), pass ? 'g' : 'r');
  if (pass){ p.status = 'active'; p.stall = 0; p.progress = 0; advance(p); }
  else {
    S.projects = S.projects.filter(x => x !== p); S.fails++; updateExp();
    log(p.cand.code + ' 复议失败，项目终止。', 'r');
  }
  render();
}

/* ========== 操作：融资 / 扩招 ========== */
function openFinance(){
  if (S.over) return;
  sheetHTML('<h2>融资</h2><div class="sub">共 ' + FIN_ROUNDS.length + ' 轮机会，出让股权会稀释你最终的结算估值。</div>'
    + FIN_ROUNDS.map((r, i) =>
        '<div class="opt ' + (i === S.finUsed ? 'on' : '') + '">'
        + '<div>第 ' + (i + 1) + ' 轮：+' + r.amt + ' 亿</div>'
        + '<div class="sub">出让股权 ' + (r.eq * 100).toFixed(0) + '% · '
        + (i < S.finUsed ? '已完成' : (i === S.finUsed ? '可进行' : '需先完成前一轮')) + '</div></div>').join('')
    + '<div class="row"><button class="primary" ' + (S.finUsed < FIN_ROUNDS.length ? '' : 'disabled')
    + ' onclick="doFinance()">执行第 ' + (S.finUsed + 1) + ' 轮融资</button>'
    + '<button class="ghost" onclick="closeSheet()">关闭</button></div>');
}
function doFinance(){
  if (S.finUsed >= FIN_ROUNDS.length) return;
  const r = FIN_ROUNDS[S.finUsed];
  S.cash += r.amt; S.equity += r.eq; S.finUsed++;
  log('完成第 ' + S.finUsed + ' 轮融资：到账 +' + r.amt + ' 亿，累计出让股权 ' + (S.equity * 100).toFixed(0) + '%。', 'g');
  closeSheet(); render();
}
function openHire(){
  if (S.over) return;
  const max = S.team >= MAX_TEAM;
  const cost = max ? 0 : 0.4 + S.team * 0.3;
  sheetHTML('<h2>扩招研发团队</h2>'
    + '<div class="opt on"><div>当前 Lv' + S.team + '</div>'
    + '<div class="sub">进度速度 ×' + teamSpeed().toFixed(2) + ' · 通过率 +' + ((S.team - 1) * 1.5).toFixed(1)
    + '% · 季度薪资 ' + f2(0.06 * S.team) + ' 亿</div></div>'
    + '<div class="sub">每升一级：进度速度 +6%、各阶段通过率 +1.5%，但每季度薪资增加 0.06 亿。上限 Lv' + MAX_TEAM + '。</div>'
    + '<div class="row"><button class="primary" ' + (max || S.cash < cost ? 'disabled' : '')
    + ' onclick="doHire()">' + (max ? '已达上限' : '升级到 Lv' + (S.team + 1) + '（-' + cost.toFixed(2) + ' 亿）') + '</button>'
    + '<button class="ghost" onclick="closeSheet()">关闭</button></div>');
}
function doHire(){
  if (S.team >= MAX_TEAM) return;
  const cost = 0.4 + S.team * 0.3;
  if (S.cash < cost){ toast('现金不足。'); return; }
  S.cash -= cost; S.team++;
  log('团队扩招至 Lv' + S.team + '，支出 ' + cost.toFixed(2) + ' 亿。', 'g');
  closeSheet(); render();
}

/* ========== 推进季度 ========== */
function nextQuarter(){
  if (!S || S.over) return;
  S.mods = {pass:0, cost:1, speed:1, rev:1};
  const L = [];

  S.projects = S.projects.filter(p => p.status !== 'launched');

  /* 1) 随机事件 */
  if (Math.random() < S.diff.evt) L.push('【事件】' + fireEvent());

  /* 2) 已上市产品：竞品挤压 + 销售投入 + 回款 */
  let gross = 0, sga = 0;
  S.marketed.forEach(m => {
    m.q++;
    if (m.comp < 4 && Math.random() < 0.26) m.comp++;
    if (m.comp >= 3 && !m.c3){ m.c3 = true; m.share *= 0.78; L.push('竞品获批上市：' + m.name + ' 市场份额承压（-22%）。'); }
    if (m.comp >= 4 && !m.c4){ m.c4 = true; m.share *= 0.85; L.push('第二个竞品进入：' + m.name + ' 份额再降 15%。'); }
    const t = salesOf(m.tier);
    m.share = clamp(m.share - SHARE_DECAY + t.def, 0.25, 1.10);
    let rev = m.peak / 4 * Math.min(1, m.q / 8) * m.share * S.mods.rev;
    if (m.q > 32) rev *= 0.4;
    const sg = rev * t.rate;
    m.lastGross = rev; m.lastSg = sg; m.lastRev = rev - sg;
    gross += rev; sga += sg;
  });
  const income = gross - sga;
  if (gross > 0){
    S.cash += income;
    L.push('上市产品净回款 +' + f2(income) + ' 亿（毛收入 ' + f2(gross) + '，销售费用 ' + f2(sga) + '）。');
  }

  /* 3) 团队薪资 */
  const salary = 0.06 * S.team;
  S.cash -= salary;
  L.push('团队 Lv' + S.team + ' 薪资 -' + f2(salary) + ' 亿。');

  /* 4) 在研项目推进与判定 */
  const dead = [];
  S.projects.forEach(p => {
    if (p.status === 'stalled'){
      p.stall--;
      if (p.stall <= 0){
        dead.push(p); S.fails++;
        L.push(p.cand.code + ' 复议窗口关闭，项目终止，积累失败经验。');
      } else {
        L.push(p.cand.code + ' 仍在暂缓待决（剩余 ' + p.stall + ' 个季度决策窗口）。');
      }
      return;
    }
    const st = STAGES[p.stage], t = tierOf(p.tier);
    if (t.c === 0){ L.push(p.cand.code + '（' + st.n + '）本季度暂停，进度冻结。'); return; }

    const spend = st.cost * t.c * p.cand.cost * p.ind.cost * S.mods.cost;
    S.cash -= spend; p.spend += spend;
    p.progress += t.s * teamSpeed() * S.mods.speed;
    L.push(p.cand.code + '（' + st.n + '）投入 ' + f2(spend) + ' 亿，阶段进度 '
         + Math.min(100, Math.round(p.progress / (st.need || 1) * 100)) + '%。');

    if (p.progress >= st.need){
      const rate = clamp(estRate(p, true), 0.03, 0.95);
      const roll = Math.random() * 100;
      if (roll <= rate * 100){
        L.push('🎲 ' + p.cand.code + ' ' + st.n + ' 判定：通过率 ' + (rate * 100).toFixed(0)
               + '%，掷出 ' + roll.toFixed(1) + ' → 通过 ✅');
        advance(p);
      } else if (st.clinical && !p.retryUsed){
        p.status = 'stalled'; p.stall = 4;
        L.push('🎲 ' + p.cand.code + ' ' + st.n + ' 判定：通过率 ' + (rate * 100).toFixed(0)
               + '%，掷出 ' + roll.toFixed(1) + ' → 失败 ❌', 'r');
        L.push(p.cand.code + ' 进入「暂缓待决」：可付 ' + RETRY_COST + ' 亿补充数据复议一次（成功率 ×0.85），4 个季度后自动终止。', 'y');
      } else {
        dead.push(p); S.fails++;
        L.push('🎲 ' + p.cand.code + ' ' + st.n + ' 判定：通过率 ' + (rate * 100).toFixed(0)
               + '%，掷出 ' + roll.toFixed(1) + ' → 失败 ❌', 'r');
        L.push(p.cand.code + ' 项目终止，公司积累一次失败经验（后续通过率 +3%）。', 'r');
      }
    }
  });
  S.projects = S.projects.filter(p => dead.indexOf(p) < 0);
  updateExp();

  /* 5) 时间推进 / 破产 / 结算 */
  S.q++;
  if (S.cash < 0) return gameOver('资金链断裂，公司进入清算程序。');
  if (S.q > MAX_Q) return gameOver('十年之期已到，公司进入期末结算。');

  L.reverse().forEach(x => {
    const cls = (x.indexOf('❌') >= 0 || x.indexOf('终止') >= 0) ? 'r'
              : (x.indexOf('🎉') >= 0 || x.indexOf('✅') >= 0 || x.indexOf('经验') >= 0) ? 'g' : '';
    log(x, cls);
  });
  render();
}

/* 阶段推进：通过当前阶段 → 下一阶段或上市 */
function advance(p){
  p.stage++; p.progress = 0;
  if (p.stage >= 8){
    const peak = p.ind.peak * (0.85 + Math.random() * 0.3);
    S.marketed.push({id:'m' + (UID++), name:p.cand.code, ind:p.ind.n, peak, q:0,
                     share:1, tier:'mid', comp:0, c3:false, c4:false,
                     lastRev:0, lastGross:0, lastSg:0});
    S.launched++; p.status = 'launched';
    log('🎉 ' + p.cand.code + ' 获批上市！适应症 ' + p.ind.n + '，峰值年收入预期 ' + peak.toFixed(1)
        + ' 亿。上市后记得在上市卡上选销售投入档位——不投就等着竞品抢份额。', 'g');
  } else {
    log(p.cand.code + ' 通过，进入「' + STAGES[p.stage].n + '」。', 'g');
  }
  updateExp();
}

/* 随机事件 */
function fireEvent(){
  const act = S.projects.filter(p => p.status === 'active');
  const pool = [
    () => { S.mods.pass += 0.06; return '监管窗口利好：本季度所有阶段通过率 +6%。'; },
    () => { S.mods.cost *= 1.30; return 'CRO 涨价：本季度研发支出 +30%。'; },
    () => { S.mods.cost *= 0.80; return '原料议价成功：本季度研发支出 -20%。'; },
    () => { S.mods.speed *= 1.25; return '团队状态极佳：本季度项目进度 +25%。'; },
    () => { S.cash += 0.80; return '学术大会数据亮眼，收到 BD 合作意向金 +0.80 亿。'; },
    () => { S.cash -= 0.50; return 'GMP 飞行检查发现偏差，罚款 -0.50 亿。'; },
    () => { S.cash -= 0.40; return '实验室设备故障，维修支出 -0.40 亿。'; }
  ];
  if (act.length) pool.push(() => {
    const p = act[rnd(act.length)];
    p.progress = Math.max(0, p.progress - 0.5);
    return '核心研究员离职：' + p.cand.code + ' 阶段进度回退 0.5 个季度。';
  });
  if (S.marketed.length) pool.push(() => {
    S.mods.rev *= 1.25; return '医保谈判成功：本季度上市产品毛收入 +25%。';
  });
  if (S.marketed.length) pool.push(() => {
    S.mods.rev *= 0.70; return '集采与专利挑战压力：本季度上市产品毛收入 -30%。';
  });
  if (S.marketed.length) pool.push(() => {
    const m = S.marketed[rnd(S.marketed.length)];
    m.peak *= 0.85; return '临床数据被竞品超越：' + m.name + ' 峰值收入预期下调 15%。';
  });
  if (S.marketed.length) pool.push(() => {
    const m = S.marketed[rnd(S.marketed.length)];
    m.comp = Math.min(4, m.comp + 1);
    return '竞品进入审评加速通道：' + m.name + ' 竞品威胁 +1。';
  });
  return pool[rnd(pool.length)]();
}

/* ========== 期末结算 ========== */
function gameOver(reason){
  S.over = true;
  const pipe = S.projects.reduce((a, p) => a + p.ind.peak * 0.5 * (p.stage / 8), 0);
  const mkt  = S.marketed.reduce((a, m) => a + m.peak * m.share * 1.2 * (m.q > 32 ? 0.5 : 1), 0);
  const gross = S.cash + pipe + mkt;
  const net = gross * (1 - S.equity);
  const rank = net >= 60 ? '传奇药企' : net >= 30 ? '卓越生科' : net >= 15 ? '优秀 Biotech'
             : net >= 6 ? '稳健经营' : net >= 0 ? '勉强存活' : '资不抵债';
  S.result = {gross, net, rank};
  render();
  sheetHTML('<h2>期末结算 · ' + S.diff.n + '难度</h2><div class="sub">' + reason + '</div>'
    + '<div class="opt"><div>账面现金</div><div class="sub">' + f2(S.cash) + ' 亿</div></div>'
    + '<div class="opt"><div>已上市产品估值</div><div class="sub">' + f2(mkt) + ' 亿（按峰值年收入 × 当前份额 × 1.2 倍）</div></div>'
    + '<div class="opt"><div>在研管线估值</div><div class="sub">' + f2(pipe) + ' 亿</div></div>'
    + '<div class="opt"><div>累计出让股权</div><div class="sub">' + (S.equity * 100).toFixed(0) + '%</div></div>'
    + '<div class="opt on"><div>股东权益 ' + f2(net) + ' 亿 · 评级：' + rank + '</div>'
    + '<div class="sub">上市产品 ' + S.launched + ' 个 · 终止项目 ' + S.fails + ' 个 · 团队 Lv' + S.team
    + ' · 经验加成 +' + (S.exp * 100).toFixed(0) + '%</div></div>'
    + '<div class="row"><button class="primary" onclick="restart()">换个难度重开</button>'
    + '<button class="ghost" onclick="closeSheet()">看看棋盘</button></div>');
}
function restart(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  closeSheet(); startSheet();
}

/* ========== 开局 / 弹层 ========== */
function startSheet(){
  sheetHTML('<h2>新药风云 v3.1</h2><div class="sub">把分子从靶点推到上市，第 40 季度期末结算。先选难度：</div>'
    + Object.keys(DIFFS).map(k => {
        const d = DIFFS[k];
        return '<div class="opt" onclick="startGame(\'' + k + '\')">'
          + '<div>' + d.n + '难度</div>'
          + '<div class="sub">初始现金 ' + d.cash + ' 亿 · 各阶段通过率 '
          + (d.pass >= 0 ? '+' : '') + Math.round(d.pass * 100) + '% · 随机事件频率 '
          + Math.round(d.evt * 100) + '%</div></div>';
      }).join(''));
}
function startGame(k){ closeSheet(); newGame(k); }
function sheetHTML(html){ $('#sheet').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeSheet(){ $('#modal').classList.add('hidden'); }
function openRules(){
  sheetHTML('<h2>玩法说明</h2>'
    + '<div class="opt"><div>目标</div><div class="sub">把项目从靶点推到上市，第 40 季度做期末结算，看股东权益评级（含股权稀释）。</div></div>'
    + '<div class="opt"><div>难度</div><div class="sub">新手：现金 10 亿、通过率 +8%、事件少；标准：现金 8 亿；硬核：现金 6 亿、通过率 -7%、事件更频繁。</div></div>'
    + '<div class="opt"><div>节奏</div><div class="sub">每季度为每个在研项目选投入档位（暂停/低/中/高），点「推进下一季度」结算：扣钱、涨进度、掷骰判定。</div></div>'
    + '<div class="opt"><div>通过率</div><div class="sub">阶段基础通过率 × 适应症难度系数 × 候选分子成药性，再加减团队、经验、投入档位与难度修正，区间锁定在 3%～95%。</div></div>'
    + '<div class="opt"><div>复议</div><div class="sub">临床 I/II/III 期失败会进入「暂缓待决」，可付 1.2 亿补充数据再搏一次（成功率 ×0.85，仅一次），4 个季度不决策自动终止。</div></div>'
    + '<div class="opt"><div>上市后</div><div class="sub">收入 = 峰值年收入 ÷ 4 × 爬坡系数 × 市场份额。份额每季度被动流失 1.2%，销售投入档位可防守（中 +1.0%、高 +2.2%），但要按毛收入的 12%/20%/30% 付销售费用。</div></div>'
    + '<div class="opt"><div>竞品</div><div class="sub">每个上市产品都有 4 格竞品威胁，会随时间累积；第 3 格触发竞品上市（份额 -22%），第 4 格再 -15%。份额下限 25%。</div></div>'
    + '<div class="opt"><div>经验</div><div class="sub">每终止一个项目，后续所有项目通过率 +3%；每上市一个产品 +5%，上限 +18%。</div></div>'
    + '<div class="opt"><div>风险</div><div class="sub">现金为负立即清算。上市 32 个季度后遇专利悬崖，毛收入降至 40%。</div></div>'
    + '<div class="row"><button class="primary" onclick="closeSheet()">知道了</button>'
    + '<button class="ghost" onclick="restart()">换个难度重开</button></div>');
}

/* ========== PWA：图标 + manifest 自动生成 ========== */
function initPWA(){
  try{
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#0b0f1a'; g.fillRect(0, 0, 512, 512);
    const grd = g.createLinearGradient(0, 0, 512, 512);
    grd.addColorStop(0, '#4f8cff'); grd.addColorStop(1, '#7c5cff');
    g.fillStyle = grd; g.beginPath(); g.arc(256, 256, 196, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.font = 'bold 250px sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('药', 256, 272);
    const icon = c.toDataURL('image/png');

    const al = document.createElement('link'); al.rel = 'apple-touch-icon'; al.href = icon;
    document.head.appendChild(al);

    const mf = {name:'新药风云 · 从靶点到上市', short_name:'新药风云', start_url:'./',
      scope:'./', display:'standalone', orientation:'portrait',
      background_color:'#0b0f1a', theme_color:'#0b0f1a',
      icons:[{src:icon, sizes:'512x512', type:'image/png', purpose:'any maskable'}]};
    const blob = new Blob([JSON.stringify(mf)], {type:'application/manifest+json'});
    const ml = document.createElement('link'); ml.rel = 'manifest'; ml.href = URL.createObjectURL(blob);
    document.head.appendChild(ml);
  }catch(e){}
}

/* ========== 启动 ========== */
function boot(){
  initPWA();
  const s = load();
  if (s){
    S = s;
    if (S.over) S.over = false;
    render();
    const y = Math.floor((S.q - 1) / 4) + 1;
    sheetHTML('<h2>检测到本地存档（' + S.diff.n + '难度）</h2>'
      + '<div class="sub">进度：第 ' + y + ' 年 · 现金 ' + f2(S.cash) + ' 亿 · 在研 '
      + S.projects.filter(p => p.status !== 'launched').length + ' 个 · 已上市 ' + S.launched + ' 个</div>'
      + '<div class="row"><button class="primary" onclick="closeSheet()">继续游戏</button>'
      + '<button class="ghost" onclick="restart()">重新开始</button></div>');
  } else {
    startSheet();
  }
}
boot();
